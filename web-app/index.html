<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FUSKAMO</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="app-root">

  <div class="topbar">
    <a href="#/feed" class="brand">FUSKAMO</a>
    <div class="actions">
      <button class="icon-btn" onclick="go('/search')">🔍</button>
      <button class="icon-btn" onclick="go('/notifications')">🔔</button>
    </div>
  </div>

  <!-- Auth gate -->
  <div id="view-auth" class="view">
    <h1 style="margin-bottom:4px">FUSKAMO</h1>
    <p class="sub" style="margin-bottom:20px">Global football talent discovery.</p>
    <div class="tabs">
      <div class="tab active" id="auth-tab-signin" onclick="setAuthTab('signin')">Sign in</div>
      <div class="tab" id="auth-tab-signup" onclick="setAuthTab('signup')">Create account</div>
    </div>
    <div id="auth-signin">
      <label>Email</label>
      <input type="email" id="signin-email" placeholder="you@example.com">
      <label>Password</label>
      <input type="password" id="signin-password" placeholder="••••••••">
      <button class="btn" onclick="doSignIn()">Sign in</button>
    </div>
    <div id="auth-signup" style="display:none">
      <label>Display name</label>
      <input type="text" id="signup-name" placeholder="Your name">
      <label>Role</label>
      <select id="signup-role">
        <option value="player">Player</option>
        <option value="scout">Scout</option>
        <option value="coach">Coach</option>
        <option value="club">Club</option>
        <option value="fan">Fan</option>
      </select>
      <label>Email</label>
      <input type="email" id="signup-email" placeholder="you@example.com">
      <label>Password</label>
      <input type="password" id="signup-password" placeholder="At least 8 characters">
      <button class="btn" onclick="doSignUp()">Create account</button>
    </div>
    <p class="muted" id="auth-error" style="color:var(--red);margin-top:10px"></p>
  </div>

  <!-- Screens -->
  <div id="view-feed" class="view"></div>
  <div id="view-discover" class="view"></div>
  <div id="view-region" class="view"></div>
  <div id="view-search" class="view"></div>
  <div id="view-upload" class="view"></div>
  <div id="view-scouts" class="view"></div>
  <div id="view-scout-apply" class="view"></div>
  <div id="view-scout-preferences" class="view"></div>
  <div id="view-groups" class="view"></div>
  <div id="view-group" class="view"></div>
  <div id="view-create-group" class="view"></div>
  <div id="view-group-admin" class="view"></div>
  <div id="view-messages" class="view"></div>
  <div id="view-conversation" class="view"></div>
  <div id="view-message-requests" class="view"></div>
  <div id="view-reels" class="view"></div>
  <div id="view-scoreboard" class="view"></div>
  <div id="view-achievements" class="view"></div>
  <div id="view-notifications" class="view"></div>
  <div id="view-notification-preferences" class="view"></div>
  <div id="view-profile" class="view"></div>
  <div id="view-public-profile" class="view"></div>
  <div id="view-edit-profile" class="view"></div>
  <div id="view-account-settings" class="view"></div>
  <div id="view-security-settings" class="view"></div>
  <div id="view-story-settings" class="view"></div>
  <div id="view-verification" class="view"></div>
  <div id="view-moderation" class="view"></div>
  <div id="view-analytics" class="view"></div>
  <div id="view-mfa-setup" class="view"></div>

  <div class="bottom-nav" id="bottom-nav">
    <button class="nav-tab" data-tab="feed" onclick="go('/feed')"><span class="ic">🏠</span><span class="lb">Feed</span></button>
    <button class="nav-tab" data-tab="discover" onclick="go('/discover')"><span class="ic">🌍</span><span class="lb">Discover</span></button>
    <button class="nav-tab fab" onclick="go('/upload')">+</button>
    <button class="nav-tab" data-tab="groups" onclick="go('/groups')"><span class="ic">💬</span><span class="lb">Groups</span></button>
    <button class="nav-tab" data-tab="scouts" onclick="go('/scouts')"><span class="ic">🕸</span><span class="lb">Scouts</span></button>
    <button class="nav-tab" data-tab="profile" onclick="go('/profile')"><span class="ic">👤</span><span class="lb">Profile</span></button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
