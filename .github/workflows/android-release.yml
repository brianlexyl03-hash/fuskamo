name: Build Signed Android Release

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      - name: Write .env
        run: |
          cat > .env << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}
          BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}
          PLAYER_DISCOVERY_V2=true
          EOF

      - name: Decode release keystore
        run: |
          mkdir -p android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/fuskamo-release.jks
          chmod 600 android/fuskamo-release.jks

      - name: Verify release keystore
        run: |
          keytool -list \
            -keystore android/fuskamo-release.jks \
            -storepass "${{ secrets.STOREPASS }}" \
            -alias "${{ secrets.ALIAS }}" \
            -keypass "${{ secrets.KEYPASS }}" >/dev/null

      - name: Write key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.STOREPASS }}
          keyPassword=${{ secrets.KEYPASS }}
          keyAlias=${{ secrets.ALIAS }}
          storeFile=../fuskamo-release.jks
          EOF

      - run: flutter pub get

      - name: Build installable APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: fuskamo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fuskamo-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
